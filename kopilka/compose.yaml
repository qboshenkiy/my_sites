services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports: ["127.0.0.1:8160:8160"]
    volumes: ["finance-data:/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  bot:
    build: .
    restart: unless-stopped
    command: ["python", "src/bot.py"]
    environment:
      DATA_DIR: /data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes: ["finance-data:/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: {disable: true}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  finance-data:
