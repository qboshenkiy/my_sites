name: kirkom-kargo
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    ports: ["127.0.0.1:8185:8080"]
    volumes: ["cargo-data:/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  cargo-data:
