services:
  web:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        aliases: [smm-portfolio-web]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  proxy:
    external: true
    name: glava-marathon_default
