plugins { id 'com.android.application' }

def gameUrl = providers.gradleProperty('gameUrl').orElse('https://chrono.vano.sbena.net/').get()
def address = new URI(gameUrl)
if (address.scheme != 'https' || !address.host || address.userInfo || address.query || address.fragment) {
    throw new GradleException('gameUrl must be an HTTPS website URL without credentials, query or fragment')
}
android {
    namespace 'net.sbena.vano.chronologos'
    compileSdk 36
    defaultConfig {
        applicationId 'net.sbena.vano.chronologos'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        buildConfigField 'String', 'GAME_URL', groovy.json.JsonOutput.toJson(gameUrl)
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'
}
