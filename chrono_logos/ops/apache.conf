LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" combined
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
    <Directory /var/www/html/public/uploads>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|sh|html?|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>
    # TLS terminates at the existing reverse proxy; publish the web port only
    # on loopback when connecting a domain through that proxy.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
