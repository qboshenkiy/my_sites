server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 location = /healthz { access_log off; return 200 'ok'; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ =404; }
}
