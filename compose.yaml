name: pulse
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:80"
    environment:
      QUIZ_DATA_DIR: /var/lib/pulse
    volumes:
      - pulse_data:/var/lib/pulse
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pulse_data:
