plugins { id 'com.android.application' }
android {
    namespace 'net.sbena.vano.remote'
    compileSdk 34
    defaultConfig {
        applicationId 'net.sbena.vano.remote'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:3.14.9' }
