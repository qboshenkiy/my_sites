services:
  web:
    build: .
    restart: unless-stopped
    environment:
      GUARD_DOMAIN: guard.vano.sbena.net
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8150:8150"
    volumes:
      - guard-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  guard-data:
