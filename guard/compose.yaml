services:
  web:
    build: .
    restart: unless-stopped
    environment:
      GUARD_DOCKER_BRIDGE: /run/guard-docker/api.sock
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8150:8150"
    volumes:
      - guard-data:/data
      - /run/guard-firewall:/run/guard-firewall:ro
      - /run/guard-docker:/run/guard-docker:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  guard-data:
