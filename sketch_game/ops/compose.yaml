name: sketch-game
services:
  web:
    build:
      context: .
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-8084}:80'
    environment:
      APP_URL: ${APP_URL:-http://localhost:8084/}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      GAME_ACCESS_CODE: ${GAME_ACCESS_CODE:?Set GAME_ACCESS_CODE}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
    volumes:
      - data:/var/lib/sketch
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  data:
