name: Build Notes Android
on:
  push:
    branches: [main]
    paths: ['notes/native/android/**', '.github/workflows/notes-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: notes/native/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain lintRelease assembleRelease
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk notes-android.apk
          gh release view notes-latest || gh release create notes-latest --title 'Заметки — Android' --notes 'Нативная оболочка общей серверной Копилки. Вход по паролю приложения.'
          gh release upload notes-latest notes-android.apk --clobber
