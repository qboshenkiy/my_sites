name: Build Marathon Android APK
on:
  workflow_dispatch:
    inputs:
      marathon_url:
        description: 'Адрес марафона, обычно https://vano.sbena.net/'
        required: true
        default: 'https://vano.sbena.net/'
        type: string
      allow_http_debug:
        description: 'Временно разрешить HTTP для vano.sbena.net:8081 в тестовом APK'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marathon/native/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            marathon/native/android/**/*.gradle
            marathon/native/android/gradle.properties
            marathon/native/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo 'Configure ANDROID_KEYSTORE_B64'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and build the APK
        env:
          MARATHON_BUILD_URL: ${{ inputs.marathon_url }}
          ALLOW_HTTP_DEBUG: ${{ inputs.allow_http_debug }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PmarathonUrl="$MARATHON_BUILD_URL" -PallowHttpDebug="$ALLOW_HTTP_DEBUG" testDebugUnitTest lintDebug assembleDebug
      - name: Downloadable test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glava-marathon-android-debug
          path: marathon/native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
