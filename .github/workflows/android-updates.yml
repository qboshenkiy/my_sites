name: Publish signed Android updates
on:
  push:
    branches: [main]
    paths:
      - 'native-common/**'
      - 'marathon/native/android/**'
      - 'chrono_logos/native/android/**'
      - 'vano_remote/android/**'
      - 'tools/android_manifest.py'
      - '.github/workflows/android-updates.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore the permanent signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo 'Configure ANDROID_KEYSTORE_B64 before publishing; never generate a different signing key'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test Android applications
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          name="1.1.$GITHUB_RUN_NUMBER"
          mkdir -p android-release
          for module in marathon chrono_logos vano_remote; do
            if [ "$module" = vano_remote ]; then project="$module/android"; else project="$module/native/android"; fi
            chmod +x "$project/gradlew"
            "$project/gradlew" --project-dir "$project" --no-daemon --console=plain -PappVersionCode="$code" -PappVersionName="$name" testDebugUnitTest lintDebug assembleDebug
          done
          cp marathon/native/android/app/build/outputs/apk/debug/app-debug.apk android-release/marathon.apk
          cp chrono_logos/native/android/app/build/outputs/apk/debug/app-debug.apk android-release/chrono-logos.apk
          cp vano_remote/android/app/build/outputs/apk/debug/app-debug.apk android-release/vano-remote.apk
          python3 tools/android_manifest.py android-release "$code" "$name"
          echo "ANDROID_CODE=$code" >> "$GITHUB_ENV"
      - name: Publish immutable APKs and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "android-$ANDROID_CODE" >/dev/null 2>&1; then
            gh release download "android-$ANDROID_CODE" --dir android-release --pattern '*.apk' --clobber
            python3 tools/android_manifest.py android-release "$ANDROID_CODE" "1.1.$GITHUB_RUN_NUMBER"
          else
            gh release create "android-$ANDROID_CODE" android-release/*.apk --title "Android $ANDROID_CODE" --notes 'Автоматическая сборка Android-приложений марафона, Chrono Logos и Vano Remote. Данные приложений сохраняются.' --target "$GITHUB_SHA"
          fi
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title 'Android updates' --notes 'Stable update feed for installed applications.' --target "$GITHUB_SHA"
          gh release upload android-latest android-release/updates.json --clobber
