name: Build Chrono Logos Android APK
on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'HTTPS-адрес Chrono Logos, например https://vano.sbena.net:8083/'
        required: true
        default: 'https://vano.sbena.net:8083/'
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chrono_logos/native/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            chrono_logos/native/android/**/*.gradle
            chrono_logos/native/android/gradle.properties
            chrono_logos/native/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and build the APK
        env:
          CHRONO_BUILD_URL: ${{ inputs.game_url }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PgameUrl="$CHRONO_BUILD_URL" testDebugUnitTest lintDebug assembleDebug
      - name: Downloadable test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrono-logos-android-debug
          path: chrono_logos/native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
