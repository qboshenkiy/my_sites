name: glava-marathon
services:
  web:
    build: .
    restart: unless-stopped
    environment: &app-env
      MARATHON_DATA_DIR: /var/lib/marathon
      MARATHON_TIMEZONE: Asia/Bishkek
      MARATHON_TRUST_PROXY: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - marathon_data:/var/lib/marathon
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  bot:
    build: .
    profiles: [telegram]
    restart: unless-stopped
    user: www-data
    command: [php, /opt/marathon/bot.php]
    healthcheck:
      disable: true
    environment: *app-env
    volumes:
      - marathon_data:/var/lib/marathon
    depends_on:
      web:
        condition: service_healthy
    logging: *logs
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logs
volumes:
  marathon_data:
  caddy_data:
  caddy_config:
