plugins { id 'com.android.application' }

def marathonUrl = providers.gradleProperty('marathonUrl').orElse('https://vano.sbena.net/').get()
def allowHttpDebug = providers.gradleProperty('allowHttpDebug').orElse('false').get() == 'true'
def address = new URI(marathonUrl)
def temporaryHttp = allowHttpDebug && address.scheme == 'http' && address.host == 'vano.sbena.net' && address.port == 8081
if ((address.scheme != 'https' && !temporaryHttp) || !address.host || address.userInfo || address.query || address.fragment) {
    throw new GradleException('marathonUrl must be an HTTPS website URL without credentials, query or fragment')
}
android {
    namespace 'net.sbena.vano.marathon'
    compileSdk 36
    defaultConfig {
        applicationId 'net.sbena.vano.marathon'
        minSdk 24
        targetSdk 36
        versionCode providers.gradleProperty('appVersionCode').orElse('100').get().toInteger()
        versionName providers.gradleProperty('appVersionName').orElse('1.1.0').get()
        buildConfigField 'String', 'MARATHON_URL', groovy.json.JsonOutput.toJson(marathonUrl)
    }
    sourceSets { main { java.srcDir '../../../../native-common/src'; res.srcDir '../../../../native-common/res' }; test.java.srcDir '../../../../native-common/tests' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { buildConfigField 'boolean', 'ALLOW_HTTP_DEBUG', temporaryHttp.toString() }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'ALLOW_HTTP_DEBUG', 'false'
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'
}

// A temporary HTTP test URL must never be packaged as a production release.
gradle.taskGraph.whenReady { graph ->
    if (temporaryHttp && graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        throw new GradleException('HTTP is allowed only in a debug APK; use HTTPS for release')
    }
}
